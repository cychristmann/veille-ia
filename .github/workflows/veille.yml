# Veille IA quotidienne : lance l'agent chaque matin, garde la veille dans le dépôt
# (historique), puis publie l'app sur GitHub Pages.
#
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
#   GROQ_API_KEY     obligatoire
#   YOUTUBE_API_KEY  facultatif (sans lui, la rubrique Vidéos explique comment l'obtenir)
#   GEMINI_API_KEY   facultatif : secours (Gemini) quand Groq refuse (quota, panne)

name: Veille IA quotidienne

on:
  schedule:
    # Heures UTC. GitHub lance les tâches programmées avec un retard qui peut atteindre
    # plusieurs heures (observé : 7 à 8 h) : on vise tôt, et on prévoit une seconde
    # tentative, qui ne refait la veille que si celle du jour n'existe pas encore.
    - cron: "7 0 * * *" # 1 h 07 à Paris en hiver (2 h 07 en été)
    - cron: "7 4 * * *" # 5 h 07 à Paris en hiver (6 h 07 en été) : seconde tentative
  workflow_dispatch: # bouton « Run workflow » pour lancer une veille à la main
  push:
    # Une modification de l'app (design, code) republie le site sans relancer la veille.
    # Les commits du robot ne touchent que veilles/ et cerveau/ : ils ne redéclenchent rien.
    branches: [main]
    paths-ignore: ["veilles/**", "cerveau/**"]

# Sécurité : les actions sont verrouillées sur l'empreinte exacte d'une version (et non
# « @v4 », qui peut être déplacé). Pour mettre à jour, remplacer l'empreinte par celle
# d'une version plus récente publiée par l'éditeur.

permissions:
  contents: write # enregistrer la veille du jour dans le dépôt
  pages: write # publier le site
  id-token: write # exigé par la publication GitHub Pages

concurrency:
  group: veille-ia
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 50 # veille + mémoire + enquêtes du rédacteur : ~20 min avec les pauses Groq
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    env:
      TZ: Europe/Paris # les fichiers de veille portent la date de Paris
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Installer uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Installer les dépendances
        run: uv sync --locked

      # Sur un push, on republie seulement. Sur une tâche programmée, on ne refait pas une
      # veille déjà faite aujourd'hui (seconde tentative). À la main, on force toujours.
      - name: Faut-il lancer la veille ?
        id: decision
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "lancer=false" >> "$GITHUB_OUTPUT"; echo "Push : republication seule."
          elif [ "${{ github.event_name }}" = "schedule" ] && [ -f "veilles/veille-ia-fr-$(date +%F).json" ] \
               && [ -f "veilles/veille-ia-us-$(date +%F).json" ] && [ -f "veilles/veille-ia-cn-$(date +%F).json" ]; then
            echo "lancer=false" >> "$GITHUB_OUTPUT"; echo "La veille du $(date +%F) existe déjà : rien à refaire."
          else
            echo "lancer=true" >> "$GITHUB_OUTPUT"; echo "Veille du $(date +%F) à produire."
          fi

      - name: Lancer la veille (France, États-Unis, Chine)
        if: steps.decision.outputs.lancer == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # secours (facultatif)
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: uv run python agent.py

      - name: Mettre à jour la mémoire des feuilletons
        if: steps.decision.outputs.lancer == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # secours (facultatif)
        run: uv run python memoire.py

      - name: Rédacteur en chef (enquêtes et dossiers du jour)
        if: steps.decision.outputs.lancer == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # secours (facultatif)
        run: uv run python redacteur.py

      - name: Analyser les tendances de la semaine
        if: steps.decision.outputs.lancer == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # secours (facultatif)
        run: uv run python tendances.py

      # Coffre Obsidian relié par Graphify (cerveau/coffre). Facultatif : une panne ici ne
      # doit jamais empêcher la publication de la veille.
      - name: Deuxième cerveau (Graphify + Obsidian)
        if: steps.decision.outputs.lancer == 'true'
        continue-on-error: true
        timeout-minutes: 15
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} # détection des doublons
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python cerveau.py

      # Agent interprète : lit le graphe sur 7 jours et rédige « Analyse du jour »
      # (cerveau/analyses + note Obsidian). Facultatif, comme le cerveau.
      - name: Interpréter le graphe (analyse du jour)
        if: steps.decision.outputs.lancer == 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # secours
        run: uv run python interprete.py

      - name: Enregistrer la veille dans le dépôt
        if: steps.decision.outputs.lancer == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veilles/ cerveau/
          git diff --cached --quiet || git commit -m "Veille du $(date +%F)"
          git push

      - name: Construire le site
        run: uv run python publier.py

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Envoyer le site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

      - name: Publier
        id: publication
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
